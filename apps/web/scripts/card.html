<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>our.one, the link card</title>
<style>
  /* The link card (D-0024 §D), 1200 by 630: the headline on the paper, in
     the identity's own colours (globals.css, .public), set in the sans the
     site uses. Rendered once by scripts/card.ts into public/card.png. */
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f5f3eb;
    color: #222b24;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .card {
    position: relative;
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 72px 80px;
  }
  .wordmark {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.07em;
    line-height: 1;
  }
  .dot { color: #bf411d; }
  .eyebrow {
    margin: 52px 0 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .headline {
    margin: 22px 0 0;
    max-width: 1000px;
    font-size: 108px;
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.064em;
  }
  .ours {
    color: #bf411d;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.04em;
  }
  .status {
    position: absolute;
    left: 80px;
    bottom: 64px;
    font-size: 22px;
    color: #586157;
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 18px;
    background: #e1f28b;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">our<span class="dot">.</span>one</div>
    <p class="eyebrow">AI helps us build. Together, we can make it ours.</p>
    <h1 class="headline">The software we live in should be <span class="ours">ours.</span></h1>
    <p class="status">Founder-led today. User control isn't built yet.</p>
    <div class="band"></div>
  </div>
</body>
</html>
