outcome: >
  Amend the class lines of R-SOURCE-HIERARCHY, R-TRUTHFUL-STATUS,
  R-PUBLIC-PRIVATE, R-EXACT-ARTIFACT and R-NO-FICTIONAL-OWNERSHIP to state
  what holds them as of the kernel at M-0006 — three said more than holds,
  two said less — with the article bodies unchanged and the exact text in
  the decision; and authorize M-0008 to add a conformance test that fails
  when a class line names a kernel rule no finding carries, an articles
  report, and the proof page importing the kernel's article parser.

