  path: decisions/D-0014.md

proposal: P-0008
prerequisite_decisions: [D-0013]

outcome: >
  The controller's contact email is privacy@ctrlai.com. Ctrl AI, Inc.
  designates the founder, Rado Sukala, as its representative in the EU under
  GDPR Article 27, by a written designation the founder signs for Ctrl AI
  and accepts personally; no public page names a representative until it is
  signed.
  The representative is reached at the same address. /privacy names the
  representative from the server setting DATA_CONTROLLER_REPRESENTATIVE, and
  only while a controller is named. The founder's full legal name and
  jurisdiction of residence stay [CONFIRM] in FOUNDING-AUTHORITY §3; no
  country or address is published. The draft M-0012 is amended to match.

authorizes:
  mandate_classes: []
  mandate_ids: []

prohibits:
  - naming a representative on a public page before the written designation is signed
  - publishing the founder's address or country before FOUNDING-AUTHORITY §3 records them
  - an agent resolving any FOUNDING-AUTHORITY [CONFIRM]

