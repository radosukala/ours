schema: ours.decision/v0.1
decision_id: D-0008
title: Authorize the v0 runtime, the fixture tenant on it, and the swap
status: DRAFT
class: PRODUCT_MANDATE

authority:
  source: founder-bootstrap
  actor:
    id: founder
    kind: human
    role: founder-steward
  procedure: founder-bootstrap-declaration
  higher_sources:
    - path: authority/FOUNDING-AUTHORITY.md
    - path: constitution/CONSTITUTION-0.1.md

human_source:
  path: decisions/D-0008.md

prerequisite_decisions: [D-0006, D-0007]

outcome: >
  Authorize M-0007, a BUILD mandate for the v0 runtime of the layer —
  identity, standing, a scoped store, the client as a capability-scoped
  API, the disclosure boundary with an egress allowlist, the access log,
  export and deletion, each tenant's trace, bundle and digest — the
  fictional community's booking tool running on it as a tenant, built to
  the pinned specification through a spec-driven pipeline, and the
  rehearsed swap of that tool for a second implementation with the records
  intact. Fictional data only; nothing deployed; no name and no real
  person's data before D-0007's opening conditions are rehearsed.

authorizes:
  mandate_classes: [BUILD]
  mandate_ids: [M-0007]

prohibits:
  - any real person's data on the layer under M-0007
  - deployment to any environment; a release is a separate mandate after D-0007's pre-opening rehearsals
  - a second community, a third-party application, a marketplace, or a payment surface
  - changing the fixture's specification, charter, or pin under M-0007
  - any claim that confinement holds beyond what the tests show, or that anything is owned by anyone

effective_from: 2026-09-08T00:00:00Z
expires_at: 2026-12-31T00:00:00Z

dissent: []
dissent_note: >
  None recorded. One participant.

appeal:
