  This record authorises nothing: M-0021's verification clause authorises the
  build's fixes. The choices it makes that the founder may overturn are listed
  under "Open, and the founder's" in the decision: rule 6, what a database
  reader can infer, the count's word, the first screen's line and the choices
  of section D, the first screen below the fold on a small window, the seats
  and the publishing of named apps.

