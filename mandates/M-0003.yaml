schema: ours.mandate/v0.1
mandate_id: M-0003
title: Build OURS Feed v0 — the governed surface
status: SUPERSEDED
class: BUILD

authority:
  source_decision: D-0003
  granted_by: founder-bootstrap
  actor:
    id: founder
    kind: human
    role: founder-steward
  valid_from: 2026-09-02T00:00:00Z
  expires_at: 2026-12-31T00:00:00Z

institution:
  constitution_version: ours-constitution/0.1
  cell: feed
  charter_version: feed-pilot/0.1

human_source:
  path: mandates/M-0003.md

objective: >
  Build OURS Feed v0 in apps/feed — profiles, posts and replies, follows, a
  chronological home stream, export and deletion — together with the feed
  Cell's rulebook, option catalog and ranking contract as repository records,
  a settings page rendered from that catalog in which every option shows the
  rule, decision and mandate that created it, endorsement of defaults recorded
  as demand, a steward moderation path with public receipts, and the kernel
  check that refuses a build whose options lack provenance.

human_outcome: >
  A person in the pilot cohort can use a feed that looks like the ones they
  know, open its settings, read why every option exists and who decided its
  default, change what is theirs to change, endorse a different default for
  everyone, ask any feed item why it appeared, and leave with their data —
  while every surface states that a founder, not members, set the defaults.

adopted_constraints:
  - The rulebook, catalog and ranking contract are repository records read at
    build time; the interface renders no option that has no record, and a
    test fails if a catalog option is not rendered.
  - Every GOVERNED default names the decision that set it and is labelled, in
    body type, as set by founder bootstrap and not yet voted.
  - Endorsements and proposals are recorded demand; no interface element
    renders them where a vote result would be.
  - The ranking input type excludes dwell time, predicted engagement, reaction
    counts, paid boosts, advertiser interest and inferred sensitive attributes.
  - No analytics, tracking, third-party script, remote font, advertising, or
    social login; sign-in is by emailed link through a replaceable provider.
  - Adults only, self-attested at sign-up; no feature designed for minors.
  - No points, ordinals, badges, ranks, or scarce or transferable artifacts.
  - Export and deletion exist before any other feature is considered done.
  - Nothing is deployed; no environment is named; no domain is touched.
  - No fact marked [CONFIRM] is resolved, and no data controller is named.

hypotheses:
  - A settings page that explains itself is understood by a non-technical
    person without coaching.
  - Endorsement counts on defaults are used, not merely praised.
  - The option catalog survives the interface without a schema change.
  - A person alone on the feed finds the profile, the settings and the export
    worth having.

scope:
  repositories: [ours]
  paths:
    allow:
      - apps/feed/**
      - rules/feed/**
      - packages/schemas/**
      - packages/kernel/**
      - packages/cli/**
      - tests/**
      - receipts/builds/**
      - receipts/conformance/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - vitest.config.ts
      - .gitignore
    deny:
      - authority/**
      - constitution/**
      - decisions/**
      - mandates/**
      - foundation/**
      - envelopes/**
      - apps/proof/**
      - packages/verifier/**
      - exit/**
      - vercel.json
  external_systems: []

risk:
  class: LOW
  reversibility: ADDITIVE
  affected_groups: [pilot-cohort-at-release]

requirements:
  constitutional_rules:
    - R-HUMAN-AUTHORITY
    - R-TYPED-MANDATE
    - R-SCOPE
    - R-TRUTHFUL-STATUS
    - R-CHECKABLE-CLAIM
    - R-PUBLIC-PRIVATE
    - R-BUILD-DEPLOY
    - R-ROLLBACK
    - R-NO-FICTIONAL-OWNERSHIP
    - R-WEAKEST-LAYER
  security: [no-secret-exposure, no-third-party-origin]
  privacy: [no-private-identity-projection, minimum-identity, export-and-deletion]
  accessibility: [wcag-aa-target]

acceptance:
  tests:
    - pnpm ours check M-0003 authorises before the build begins, and
      pnpm ours check M-0003 --changed authorises the finished working tree.
    - The option catalog validates, and at least three invalid catalogs refuse
      for the correct reason — a missing rule, an unauthorised decision, an
      overridable FLOOR option.
    - Every rendered option resolves to a catalog record and every catalog
      record is rendered; the test runs in both directions.
    - Every GOVERNED default displays its decision and the founder-bootstrap
      label in body type.
    - Every feed item's explanation is generated by the ranking function that
      ordered it.
    - The ranking input type contains no prohibited signal, and a test fails
      the build if one is added.
    - Endorsements and proposals record and display counts under the demand
      label and nowhere else.
    - A report produces a steward action with a public receipt whose private
      details are redacted.
    - Export returns the person's data with the rulebook, catalog and
      contract; deletion removes personal data and states its residue.
    - The interface makes no request to a third-party origin.
    - The kernel's prohibited-claim scan over every copy file in apps/feed
      finds nothing.
    - Legible in light and dark at 375px and desktop; every control keyboard
      reachable with visible focus.
    - pnpm typecheck and pnpm test pass.
  evidence:
    - conformance report mapping every rulebook article to a check and its class
    - build receipts per part recording agent, model, scope touched,
      dependencies added with reasons, and failures
    - narrow-mobile and desktop inspection
    - a proposed M-0003-RELEASE, written in the final receipt for founder review

limits:
  dependency_policy: justify-new
  stop_conditions:
    - an option would have to be rendered without a catalog record
    - a default would have to be chosen by the implementer rather than by
      D-0003 or the adopted catalog
    - an acceptance test would require weakening a constitutional article or
      a rulebook article
    - a required fact is marked [CONFIRM] or would name a data controller
    - a feature would require a third-party origin at runtime
    - the work requires a path outside the allowed scope

release:
  deploy_authority_required: true
  environments: []
  production_allowed: false

rollback:
  method: >
    Remove apps/feed and rules/feed, and revert the schema, kernel, CLI and
    workspace changes. No record above the mandate is modified, and nothing
    is deployed.
  irreversible_residue: >
    None at build time. At release this changes, and M-0003-RELEASE carries
    it — once people have signed up, personal data exists and posts have been
    read.

human_approvals:
  ambiguity: founder
  adoption: founder
  rulebook-and-catalog: founder
  deploy: not-authorized
