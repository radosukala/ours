schema: ours.mandate/v0.1
mandate_id: M-0012
title: Deploy our.one — the verified build of apps/web to Vercel, with Neon and Resend, at our.one
status: DRAFT
class: DEPLOY

authority:
  source_decision: D-0013
  granted_by: founder-bootstrap
  actor:
    id: founder
    kind: human
    role: founder-steward
  valid_from: 2026-09-28T00:00:00Z
  expires_at: 2027-06-30T00:00:00Z
  prerequisite_decisions: [D-0011, D-0012, D-0013, D-0014, D-0015, D-0016, D-0017, D-0018, D-0019, D-0020, D-0021]

institution:
  constitution_version: ours-constitution/0.1
  cell: root
  charter_version: null

human_source:
  path: mandates/M-0012.md

objective: >
  Publish the verified commit of apps/web as our.one: a Vercel production
  deployment from the public repository, with a Neon Postgres database and
  Resend for email, every secret entered by the founder; the production
  build migrates the database and creates the founder's own account as the
  one administrator, from the founder's settings (M-0018); prove over HTTP
  that the deployed pages are the verified ones. Seats stay closed until
  the founder opens them.

human_outcome: >
  Anyone can open our.one and read the front page, the contract, the rules,
  privacy, costs and who controls what, naming Ctrl AI, Inc. as the
  maintainer and data controller, and its representative in the EU. The
  founder can sign in. Nobody else can
  join until the founder opens seats or sends invites.

adopted_constraints:
  - The deployed commit is the one verified under M-0011, M-0013, M-0014, M-0015, M-0016, M-0017 or M-0018, or a later one verified the same way; the release receipt names it.
  - Every secret is entered by the founder in the provider's own dashboard; no agent enters, stores or prints one.
  - Exactly one real person's address is used, the founder's, entered by the founder in Vercel for the founder's own administrator account; no agent enters it.
  - Seats stay at zero until the founder opens them.
  - Nothing public says the handover has happened, and nothing public states a fact about Ctrl AI beyond its name, its role, its contact email and its representative in the EU (D-0014).

scope:
  repositories: [ours]
  paths:
    allow:
      - receipts/releases/**
      - apps/web/transparency/**
      - apps/web/package.json
      - apps/web/vercel.json
    deny:
      - authority/**
      - constitution/**
      - decisions/**
      - mandates/**
  external_systems:
    - vercel (founder's account)
    - neon (founder's account)
    - resend (founder's account)
    - dns for our.one (founder's registrar account)

risk:
  class: HIGH
  reversibility: REVERSIBLE
  affected_groups: [everyone who opens our.one, the founder]

requirements:
  constitutional_rules:
    - R-HUMAN-AUTHORITY
    - R-BUILD-DEPLOY
    - R-TRUTHFUL-STATUS
    - R-PUBLIC-PRIVATE
    - R-ROLLBACK
  security: [secrets-entered-by-founder-only, no-secret-exposure, client-ip-header-named]
  privacy: [controller-named, eu-representative-named, one-real-address-only]

preconditions:
  - Ctrl AI's written designation of its representative in the EU (GDPR Article 27(1)), signed; D-0014 settles the contact email and the Article 27 choice
  - the founder's Vercel project linked to github.com/radosukala/ours, root directory apps/web, with no overrides for the build, install or output commands (apps/web/vercel.json sets the build command and the region fra1; Vercel picks pnpm from the lockfile), and access to the System Environment Variables on
  - a Neon database in an EU region, its URL entered by the founder in Vercel for production only, with every variable a Vercel integration adds for production only too
  - Resend with the our.one domain verified (its DNS records added by the founder)
  - "the founder's secrets in Vercel: DATABASE_URL, SESSION_SECRET (32+ random bytes), CRON_SECRET, RESEND_API_KEY, MAIL_FROM, MAIL_TRANSPORT=resend, DATA_CONTROLLER=Ctrl AI, Inc., DATA_CONTROLLER_EMAIL=privacy@ctrlai.com, DATA_CONTROLLER_REPRESENTATIVE=Rado Sukala, CLIENT_IP_HEADER=x-vercel-forwarded-for, APP_URL=https://our.one, OURS_VERSION, FOUNDER_EMAIL, FOUNDER_HANDLE, FOUNDER_NAME, and at the go OURS_RELEASE (the verified commit)"
  - ONE moved to oneburger.cz, and our.one pointed at Vercel, with the automatic assignment of custom production domains off, so that our.one serves only a deployment the founder promotes (D-0021 §D), and the production branch set to release, which only a deploy moves, with Deployment Protection on for previews (D-0021 §J)
  - a human confirms that the court's opinion says what the 7% sentence on the feed's page, /feed, cites (D-0015 §E; D-0020 §B; AGENTS.md §10)
  - the founder approves the exact wording of the common agreement at /agreement (D-0018 §B)
  - PROPOSALS_EMAIL set in Vercel to the address the founder chooses for proposals and needs (D-0018 §D)
  - the founder approves rules version 0 and the exact wording of /build and build.md (D-0019 §I), and of the front door, /feed, /projects and /maintainers, with the new line for a coding agent (D-0020 §G)
  - the Vercel project keeps files outside the root directory available to the build, because /build.md and /kit/ are read from kit/ at build time (D-0019 §I)
  - the hosting lines on /privacy and /power, and the control record behind /power, say what is true once the build runs, by a BUILD change before the deploy (D-0020 §G); M-0018 is that change, and this holds once it is verified (D-0021 §C)
  - the Vercel plan is one whose terms the founder has checked for a service run by a company; its price goes in the ledger in a later commit, verified the same way, before the public launch (D-0021 §J)
  - apps/web/.env.local holds no real key (D-0021 §F, §J)

acceptance:
  tests:
    - The deployed commit equals the named verified commit.
    - GET / returns 200 with the front door's headline; GET /feed returns 200 with the feed's headline, the live count and "Joining opens soon." until seats are opened; /contract, /rules, /privacy, /costs and /power return 200; /privacy and /power name Ctrl AI, Inc. and privacy@ctrlai.com; /privacy also names its representative in the EU, reached at the same address; neither says anything more about Ctrl AI.
    - GET /api/health reports the database reachable.
    - The production build's log shows the migrations applied and the founder's account created, and holds no address, link or key.
    - /power and /privacy name Vercel, its region and the database with its region; no page says our.one is not deployed.
    - The founder receives the sign-in link by email and signs in as the one administrator.
    - A request for a seat while none is open puts the address in line and sends nothing.
    - The weekly-email cron is protected by CRON_SECRET.
  evidence:
    - a release receipt in receipts/releases/ naming the commit, the environment, every check and its result, and what was not checked
    - screenshots of the live pages

limits:
  stop_conditions:
    - any precondition does not hold
    - a secret would have to pass through an agent
    - the deployed build differs from the verified commit

release:
  deploy_authority_required: true
  environments: [production]
  production_allowed: true

rollback:
  method: >
    Vercel's instant rollback to the previous deployment, or removing the
    our.one alias; the database restored from Neon's point-in-time history.
  irreversible_residue: emails already sent, and anything a visitor saw

human_approvals:
  adoption: the founder's explicit go in chat to deploy, once the preconditions hold
  deploy: the founder
