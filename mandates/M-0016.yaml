schema: ours.mandate/v0.1
mandate_id: M-0016
title: The build kit — build.md, the our-one.mjs tool, the our.one.json manifest, the rules block, /build, and the feed under the same check
status: ADOPTED
class: BUILD

authority:
  source_decision: D-0019
  granted_by: founder-bootstrap
  actor:
    id: founder
    kind: human
    role: founder-steward
  valid_from: 2026-10-02T00:00:00Z
  expires_at: 2027-06-30T00:00:00Z
  prerequisite_decisions: [D-0017, D-0018, D-0019]

institution:
  constitution_version: ours-constitution/0.1
  cell: root
  charter_version: null

human_source:
  path: mandates/M-0016.md

objective: >
  Build D-0019 §B to §G. In kit/: build.md, the instructions a coding agent
  follows to build a project for our.one; our-one.mjs, one file with no
  dependencies and no network access, whose init creates what a project is
  missing without overwriting anything but the rules block, whose check
  runs rules version 0 (ten machine checks, each with its class, plus the
  items a person reads and the safeguards not built), and whose rules
  prints the block; our.one.schema.json; a README. In apps/web: the feed's
  our.one.json and rules block, passing the check; /build, "Build on
  our.one", with the two ways to build side by side, the one line for a
  coding agent, what the agent does, the rules, what the check can and
  can't tell, the proposal by email, and the tools with the tool's version
  and SHA-256; routes serving build.md, the tool and the schema from the
  build; the footer's "Build with us" to /build; links from /maintainers
  and /projects; the claims scan over the kit's text. Fictional data only;
  nothing runs anywhere but this machine.

human_outcome: >
  A builder who opens /build sees the two ways to build and can start by
  giving their coding agent one line. The agent can set a project up, build
  it under the rules, check its own work, and draft a proposal, and the
  builder can read what passing means: ready to propose, nothing more.

adopted_constraints:
  - Passing the check is described only as ready to propose; never as approval, listing, certification or protection.
  - Every safeguard is shown as not built; none reads as built.
  - The tool makes no network request, writes only the files init names, and never prints a secret it finds, only the file, the line and the kind.
  - The served build.md, tool and schema are the files in kit/ at the built commit, byte for byte, and build.md's SHA-256 is the tool's.
  - The feed passes the check, by a test.
  - No form, database table or stored data for proposals; email only, as D-0018 §D decided.
  - The front page's headline and lede, the common agreement's words and the contract's promises are unchanged.
  - No real person's data, no email to a real address, no provider account, no domain touched, no package published.

hypotheses:
  - A coding agent given only the line on /build can set a project up and reach a passing check without other help.
  - A builder who reads /build can say which way to build suits them, and what passing the check means.

scope:
  repositories: [ours]
  paths:
    allow:
      - kit/**
      - apps/web/**
      - receipts/builds/**
      - receipts/conformance/**
    deny:
      - authority/**
      - constitution/**
      - decisions/**
      - mandates/**
      - foundation/**
      - proposals/**
      - envelopes/**
      - packages/**
      - apps/proof/**
      - communities/**
      - spec/**
      - exit/**
      - observations/**
      - vercel.json
  external_systems: []

risk:
  class: LOW
  reversibility: REVERSIBLE
  affected_groups: []

requirements:
  constitutional_rules:
    - R-HUMAN-AUTHORITY
    - R-SOURCE-HIERARCHY
    - R-TYPED-MANDATE
    - R-SCOPE
    - R-TRUTHFUL-STATUS
    - R-CHECKABLE-CLAIM
    - R-PUBLIC-PRIVATE
    - R-BUILD-DEPLOY
    - R-ROLLBACK
    - R-NO-FICTIONAL-OWNERSHIP
    - R-WEAKEST-LAYER
  security: [no-secret-exposure, no-network-in-the-tool]
  privacy: [no-real-person-data-under-this-mandate]

acceptance:
  tests:
    - Each machine check fails on a fixture project that breaks it, with a message that says how to fix it, and passes on one that keeps it; the run's result line and exit code follow.
    - init creates the files it names and nothing else, keeps every existing file except the rules block in AGENTS.md, which it restores word for word, and adds its stop hook to an existing .claude/settings.json without removing anything.
    - check --hook sends the agent back once when a rule fails (exit 2), lets it stop afterwards with a message for the person, and stays silent when everything passes.
    - The tool's source holds no network module, fetch or socket; it prints no secret it finds, only the file, the line and the kind.
    - The feed (apps/web) passes the check.
    - /build.md, /kit/our-one.mjs and /kit/our.one.schema.json serve the kit's files byte for byte with their content types; build.md's SHA-256 is the tool's.
    - /build renders SPEC §18.18's copy; the footer's "Build with us" goes to /build; /maintainers and /projects link to it.
    - The claims scan reads the kit's text and finds no prohibited claim.
    - Typecheck, lint, tests and a production build pass; the pages and files serve over HTTP; pnpm ours check M-0016 --changed authorises the finished working tree.
  evidence:
    - a build receipt in receipts/builds/ naming the commits, every check and its result, and what was not checked
    - an independent verification in receipts/conformance/, with the verifiers' tests committed as written before any is adapted
    - screenshots of /build, desktop and phone, and a transcript of the tool run on a fictional project

limits:
  stop_conditions:
    - a rule would need the tool to reach the network or read a secret's value aloud
    - a page would have to describe a passing check as approval or a safeguard as built
    - a proposal route other than email would be needed
    - the front page's headline or lede would have to change

release:
  deploy_authority_required: true
  environments: []
  production_allowed: false

rollback:
  method: revert the M-0016 commits; no data, schema or provider is touched
  irreversible_residue: none

human_approvals:
  adoption: the founder's "We should have clear instruction, and enforcment for rules and guide for coding agents ... and we should have tools for that" (D-0019)
  deploy: not authorized by this mandate (M-0012)
